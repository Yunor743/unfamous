[package]
name = "unfamous"
description = "Linux file reputation monitor: hash files, query CTI providers, alert on unknown and malicious files"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/Yunor743/unfamous"
homepage = "https://github.com/Yunor743/unfamous"
keywords = ["security", "fanotify", "threat-intelligence", "dfir", "linux"]
categories = ["command-line-utilities"]

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Targeted exceptions: doc-structure lints and lossless-in-context casts
# add noise without catching real problems in this codebase.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
match_same_arms = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "chrono"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
digest = "0.10"
hex = "0.4"
libc = "0.2"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.8"
sha2 = "0.10"
hex = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
